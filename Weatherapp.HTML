<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Weather App</title>
  <link rel="stylesheet" href="../weather_website/Weatherapp.CSS" />
</head>
<body>
  <div class="container">
    <h1>🌤️ Weather App</h1>

    <div class="search-box">
      <input type="text" id="city-input" placeholder="Enter city name" />
      <button onclick="getWeather()">Search</button>
    </div>

    <div id="weather-box" class="hidden">
      <h2 id="city-name"></h2>
      <img id="weather-icon" src="" alt="Weather Icon" />
      <p><strong>Temperature:</strong> <span id="temperature"></span> °C</p>
      <p><strong><Condit></Condit>ion:</strong> <span id="condition"></span></p>
      <p><strong>Humidity:</strong> <span id="humidity"></span>%</p>
      <p><strong>Wind Speed:</strong> <span id="wind-speed"></span> km/h</p>
    </div>
  </div>

  <script src="../weather_website/Weatherapp.JS"></script>
</body>
</html>
